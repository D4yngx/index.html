<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Te caigo bien?</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  /* Starfield background */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle linear infinite;
    opacity: 0;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
  }

  /* Soft glow orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }
  .orb1 { width: 400px; height: 400px; background: rgba(212,83,126,0.18); top: -100px; left: -100px; }
  .orb2 { width: 350px; height: 350px; background: rgba(127,119,221,0.14); bottom: -80px; right: -80px; }

  .game-container {
    position: relative;
    z-index: 1;
    width: min(480px, 95vw);
    min-height: 460px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 28px;
    backdrop-filter: blur(12px);
    padding: 2.5rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 60px rgba(212,83,126,0.08), 0 30px 60px rgba(0,0,0,0.5);
  }

  .question {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 5vw, 34px);
    font-weight: 600;
    color: #f0e8f5;
    text-align: center;
    margin-bottom: 0.7rem;
    line-height: 1.3;
    letter-spacing: -0.02em;
  }

  .counter {
    font-size: 13px;
    color: rgba(240,232,245,0.4);
    margin-bottom: 2.2rem;
    min-height: 20px;
    text-align: center;
  }

  .btn-area {
    position: relative;
    width: 100%;
    height: 220px;
  }

  /* NO — stays still, styled nicely */
  .btn-no {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(40px, -22px);
    background: rgba(255,255,255,0.07);
    color: #f0e8f5;
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 14px 38px;
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    z-index: 2;
  }
  .btn-no:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25); }
  .btn-no:active { background: rgba(255,255,255,0.18); }

  /* SÍ — escurridizo, se mueve */
  .btn-si {
    position: absolute;
    background: linear-gradient(135deg, #D4537E, #a83460);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 38px;
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    z-index: 2;
    transition: background 0.15s;
    box-shadow: 0 4px 20px rgba(212,83,126,0.35);
    /* initial position: left of center */
    left: 50%;
    top: 50%;
    transform: translate(-130px, -22px);
  }
  .btn-si:active { background: linear-gradient(135deg, #c04470, #922d55); }

  /* Result screens */
  .result-screen, .yes-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 0.9rem;
    padding: 1rem;
    animation: pop-in 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  .result-screen.show, .yes-screen.show { display: flex; }

  @keyframes pop-in {
    0% { opacity:0; transform: scale(0.5); }
    100% { opacity:1; transform: scale(1); }
  }
  .result-emoji { font-size: 56px; }
  .result-text {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 600;
    color: #f0e8f5;
  }
  .result-sub { font-size: 15px; color: rgba(240,232,245,0.5); }

  /* Confetti */
  .confetti-piece {
    position: absolute;
    border-radius: 2px;
    animation: fall linear forwards;
    pointer-events: none;
  }
  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(460px) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="game-container" id="gameWrap">
  <div id="mainGame" style="width:100%;display:flex;flex-direction:column;align-items:center;">
    <div class="question" id="questionText">¿Te caigo bien?</div>
    <div class="counter" id="counterText"></div>
    <div class="btn-area" id="btnArea">
      <!-- Sí es el escurridizo ahora -->
      <button class="btn-si" id="btnSi" onclick="clickSi()">Sí</button>
      <!-- No se queda quieto -->
      <button class="btn-no" id="btnNo" onclick="clickNo()">No</button>
    </div>
  </div>

  <div class="yes-screen" id="yesScreen">
    <div class="result-emoji">😔</div>
    <div class="result-text">Ya lo sabía...</div>
    <div class="result-sub">Pero igual me da igual. (Mentira)</div>
  </div>

  <div class="result-screen" id="noScreen">
    <div class="result-emoji">😞</div>
    <div class="result-text" style="font-family:'Playfair Display',serif">Ya sabía que no te caigo bien...</div>
    <div class="result-sub">Pero gracias por la honestidad. (Mentira, duele)</div>
  </div>
</div>

<script>
  // --- Stars ---
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%; left:${Math.random()*100}%;
      animation-duration:${2+Math.random()*4}s;
      animation-delay:${Math.random()*4}s;
    `;
    starsEl.appendChild(s);
  }

  // --- Game logic ---
  let siClicks = 0;
  const btnSi = document.getElementById('btnSi');
  const btnNo = document.getElementById('btnNo');
  const counter = document.getElementById('counterText');
  const wrap = document.getElementById('gameWrap');
  const mainGame = document.getElementById('mainGame');

  const siTexts = [
    'Sí','Sí...','En serio?','Seguro?','Piénsalo bien','Última oportunidad',
    'Noooo','No lo hagas','Te lo ruego','Sí :('
  ];

  function getAreaBounds() {
    const area = document.getElementById('btnArea');
    return { w: area.offsetWidth, h: area.offsetHeight };
  }

  function placeSiBtn() {
    const { w, h } = getAreaBounds();
    const bW = btnSi.offsetWidth || 110;
    const bH = btnSi.offsetHeight || 50;
    const margin = 8;
    const x = margin + Math.random() * Math.max(0, w - bW - margin * 2);
    const y = margin + Math.random() * Math.max(0, h - bH - margin * 2);
    btnSi.style.left = x + 'px';
    btnSi.style.top = y + 'px';
    btnSi.style.transform = 'none';
  }

  // Escape on hover/touch
  btnSi.addEventListener('mouseenter', escapeSi);
  btnSi.addEventListener('touchstart', escapeSi, { passive: true });

  function escapeSi() {
    if (siClicks >= 9) return;
    placeSiBtn();
  }

  function clickSi() {
    // If somehow they click it (mobile tap before escape)
    siClicks++;
    if (siClicks >= 10) {
      showSiEnd();
      return;
    }
    const fontSize = Math.max(11, 18 - siClicks * 1.2);
    btnSi.style.fontSize = fontSize + 'px';
    btnSi.style.padding = Math.max(6, 14 - siClicks) + 'px ' + Math.max(12, 38 - siClicks * 2) + 'px';
    btnSi.textContent = siTexts[Math.min(siClicks, siTexts.length - 1)];
    counter.textContent = 'Casi lo lograste... ' + siClicks + ' vez' + (siClicks > 1 ? 'es' : '') + ' 😅';
    placeSiBtn();
  }

  function clickNo() {
    mainGame.style.display = 'none';
    document.getElementById('noScreen').classList.add('show');
    launchConfetti();
  }

  function showSiEnd() {
    mainGame.style.display = 'none';
    document.getElementById('yesScreen').classList.add('show');
  }

  function launchConfetti() {
    const colors = ['#D4537E','#7F77DD','#1D9E75','#EF9F27','#378ADD','#E24B4A'];
    for (let i = 0; i < 50; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'confetti-piece';
        c.style.left = (5 + Math.random() * 90) + '%';
        c.style.top = '0';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
        c.style.animationDelay = (Math.random() * 0.5) + 's';
        c.style.width = (6 + Math.random() * 8) + 'px';
        c.style.height = (6 + Math.random() * 8) + 'px';
        wrap.appendChild(c);
        setTimeout(() => c.remove(), 3500);
      }, i * 35);
    }
  }
</script>
</body>
</html>
